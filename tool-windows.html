<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"><link rel="stylesheet" href="tool-windows.css"></head><body><div id="windowGrip"></div><main>  <div id="drawPanel" class="palette">

    <canvas id="toolPreview" width="176" height="100"></canvas>
    <select id="drawTool" hidden><option value="line">Line</option><option value="arrow">Arrow</option><option value="arrowOpen">Open arrow</option><option value="text">Text</option><option value="eraser">Eraser</option></select>
    <div class="toolRow" data-tool="line"><button class="toolIcon" title="Krivulja" aria-label="Pencil"><svg viewBox="0 0 20 20"><path d="M2 14C2 2 9 2 8 10S16 18 17 4"/></svg></button><div class="toolOptions"><div class="parameter" data-key="width" data-label-sl="Debelina (px)" data-label-en="Width (px)"><input id="penWidth" type="number" min="0.1" max="10000" step="0.1"></div></div></div>
    <div class="toolRow" data-tool="arrow"><button class="toolIcon" title="Polna puščica" aria-label="Arrow"><svg viewBox="0 0 20 20"><path d="M2 15C2 5 8 4 8 11S14 17 14 7"/><path d="M14 2L10 8H18Z" stroke="none" fill="currentColor"/></svg></button><div class="toolOptions"><div class="parameter" data-key="arrowLineWidth" data-label-sl="Debelina (px)" data-label-en="Width (px)"><input id="arrowLineWidth" type="number" min="0.1" max="10000" step="0.1"></div><div id="arrowOptions"><div class="parameter" data-key="arrowWidth" data-label-sl="Širina konice (px)" data-label-en="Head width (px)"><input id="arrowWidth" type="number" min="0.1" max="10000" step="0.1"></div><div class="parameter" data-key="arrowHeight" data-label-sl="Dolžina konice (px)" data-label-en="Head length (px)"><input id="arrowHeight" type="number" min="0.1" max="10000" step="0.1"></div><div class="parameter" data-key="arrowPersistence" data-label-sl="Dolžina poti (px)" data-label-en="Path length (px)"><input id="arrowPersistence" type="number" min="0.1" max="10000" step="0.1"></div><div class="parameter" data-key="arrowMinWavelength" data-label-sl="Najkrajša valovna dolžina (px)" data-label-en="Minimum wavelength (px)"><input id="arrowMinWavelength" type="number" min="0.1" max="10000" step="0.1"></div></div></div></div>
    <div class="toolRow" data-tool="arrowOpen"><button class="toolIcon" title="Odprta puščica" aria-label="Open arrow"><svg viewBox="0 0 20 20"><path d="M2 15C2 5 8 4 8 11S14 17 14 2M10 8L14 2L18 8"/></svg></button><div class="toolOptions"><div id="openArrowParameters"></div></div></div>
    <div class="toolRow" data-tool="text"><button class="toolIcon" title="Besedilo" aria-label="Text"><svg viewBox="0 0 20 20"><path d="M3 17L10 3L17 17M6 12H14"/></svg></button><div class="toolOptions"><div id="textOptions"><div class="parameter" data-key="fontSize" data-label-sl="Velikost (px)" data-label-en="Size (px)"><input id="fontSize" type="number" min="1" max="10000"></div><div class="optionRow fontOption"><div class="optionLabel" data-sl="Pisava in slog" data-en="Font and style"></div><div class="styleButtons"><button id="textBold" class="textStyle" title="Krepko" aria-label="Krepko"><b>B</b></button><button id="textItalic" class="textStyle" title="Ležeče" aria-label="Ležeče"><i>I</i></button><select id="fontFamily"><option>Arial</option><option>Helvetica</option><option>Verdana</option><option>Consolas</option><option>Comic Sans MS</option></select></div></div></div></div></div>
    <div class="toolRow" data-tool="eraser"><button class="toolIcon" title="Radirka" aria-label="Eraser"><svg viewBox="0 0 20 20"><path d="m3 12 8-9 6 5-8 9H7zM7 8l6 5M9 17h8"/></svg></button><div class="toolOptions"><div class="parameter" data-key="eraserWidth" data-label-sl="Premer (px)" data-label-en="Diameter (px)"><input id="eraserWidth" type="number" min="0.1" max="10000" step="0.1"></div><div class="optionRow eraserOption"><div class="optionLabel" data-sl="Predogled pod risbo" data-en="Preview underneath"></div><button id="eraserPreview" class="textStyle" title="Predogled radiranja" aria-label="Predogled radiranja"><svg viewBox="0 0 20 20"><path d="M2 10Q10 1 18 10Q10 19 2 10Z"/><circle cx="10" cy="10" r="3"/></svg></button></div></div></div>
  </div>
  <div id="colorPanel"><div class="drawTitle"><div class="drawOptions"><select id="colorMode"><option value="hsv">HSVA</option><option value="rgb">RGBA</option></select><select id="colorUnits"><option value="byte">0–255</option><option value="normalized">0–1</option></select><span id="colorPreview"></span></div></div>
    <canvas id="colorWheel" width="180" height="180"></canvas>
    <div id="colorSliders"></div>
  </div>
</main>  <dialog id="parameterRange" class="smallDialog"><form method="dialog"><div id="parameterRangeTitle"></div><label><span data-sl="Od" data-en="From"></span> <input id="parameterMin" type="number" step="any"></label><label><span data-sl="Do" data-en="To"></span> <input id="parameterMax" type="number" step="any"></label><div class="dialogActions"><button id="cancelParameterRange" type="button" data-sl="Prekliči" data-en="Cancel"></button><button type="submit" value="apply" data-sl="Uporabi" data-en="Apply"></button></div></form></dialog>
<script src="core.js"></script><script src="arrow-filter.js"></script><script src="curve-filter.js"></script><script src="arrow-base-direction.js"></script><script src="visual.js"></script><script src="tool-surface.js"></script></body></html>
